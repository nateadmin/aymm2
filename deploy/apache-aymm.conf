# AYMM app vhost. Point DNS for aymm.wefoundd.com to this server, then run:
# certbot --apache -d aymm.wefoundd.com

<VirtualHost *:80>
    ServerName aymm.wefoundd.com

    ErrorLog ${APACHE_LOG_DIR}/aymm-error.log
    CustomLog ${APACHE_LOG_DIR}/aymm-access.log combined

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3000/api retry=0 timeout=30
    ProxyPassReverse /api http://127.0.0.1:3000/api
    ProxyPass /login http://127.0.0.1:3000/login retry=0 timeout=30
    ProxyPassReverse /login http://127.0.0.1:3000/login
    ProxyPass / http://127.0.0.1:3000/ retry=0 timeout=30
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
