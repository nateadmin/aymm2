# AYMM app vhost — proxy to Node on 127.0.0.1:3000
# SSL: certbot --apache -d aymm.app -d www.aymm.app -d aymmapp.com -d www.aymmapp.com

<VirtualHost *:80>
    ServerName aymm.app
    ServerAlias www.aymm.app aymmapp.com www.aymmapp.com

    ErrorLog ${APACHE_LOG_DIR}/aymm-error.log
    CustomLog ${APACHE_LOG_DIR}/aymm-access.log combined

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3000/api retry=0 timeout=30
    ProxyPassReverse /api http://127.0.0.1:3000/api
    ProxyPass / http://127.0.0.1:3000/ retry=0 timeout=30
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
